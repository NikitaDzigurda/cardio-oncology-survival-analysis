[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-oncology-survival-analysis"
version = "0.1.0"
description = "Survival analysis of cardiovascular complications in colorectal cancer"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
